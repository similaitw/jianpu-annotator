<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>簡譜標註器</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;background:#eef1f4;color:#1b2430}
.bar{background:#fff;border-bottom:1px solid #d5dbe2;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;position:sticky;top:0;z-index:5}
.bar h2{margin:0 8px 0 0;font-size:18px;width:100%}
label{display:flex;flex-direction:column;font-size:12px;color:#556;gap:3px}
input[type=text],input[type=number],select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #c5ccd5;border-radius:6px;background:#fff;min-width:0}
input[type=text]{width:150px}
input[type=number]{width:64px}
label.chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:#1b2430;padding-bottom:6px}
button,.btn{font:inherit;font-size:14px;padding:7px 14px;border-radius:6px;border:1px solid #2b6cb0;background:#2b6cb0;color:#fff;cursor:pointer}
button.alt,.btn.alt{background:#fff;color:#2b6cb0}
input[type=file]{display:none}
#meta{font-size:13px;color:#556;padding-bottom:8px}
#err{color:#b42318;font-size:13px;width:100%}
.lyr{width:100%;font-size:13px;color:#445}.lyr textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #c5ccd5;border-radius:6px}
.orig{margin-bottom:10px}.orig img{max-width:100%;border:1px solid #d5dbe2}
@media print{.orig{display:none}}
.hint{font-size:12px;color:#667;width:100%}
.page{width:210mm;max-width:100%;margin:18px auto;background:#fff;padding:14mm 12mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.head{text-align:center;margin-bottom:6px}
.head h1{font-size:22px;margin:0 0 4px;font-family:"Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif}
.head .sub{margin:0 0 6px;font-size:13px;font-weight:700;font-family:"Noto Serif TC","Noto Serif CJK TC",serif}
.head .by{margin:0;text-align:right;font-size:12px;display:flex;flex-direction:column}
.row{break-inside:avoid;margin-bottom:4px}
.row svg{display:block}
@page{size:A4;margin:10mm}
@media print{body{background:#fff}.bar{display:none}.page{box-shadow:none;margin:0;padding:0;width:auto}}
</style></head><body>
<div class="bar">
<h2>簡譜標註器</h2>
<label class="btn" style="display:inline-block;margin-bottom:0">選擇 MusicXML 檔<input id="file" type="file" accept=".musicxml,.xml,.mxl"></label>
<label class="btn alt" id="omrBtn" style="display:inline-block;margin-bottom:0">從圖檔辨識（PNG／JPG／PDF）<input id="omrFile" type="file" accept="image/*,.pdf"></label>
<button id="sample" class="alt" type="button">載入範例（小星星）</button>
<label>標註<select id="kind"><option value="jianpu">簡譜 1 2 3</option><option value="solfege">唱名 Do Re Mi</option><option value="name">音名 C D E</option></select></label>
<label>調式<select id="mode"><option value="movable">首調（1=主音）</option><option value="fixed">絕對音／原調（C=1，加升降）</option></select></label>
<label>小調主音<select id="minorMode"><option value="la">6 為主音（la）</option><option value="do">1 為主音（do）</option></select></label>
<label>每行小節數<input id="perRow" type="number" min="1" max="8" value="4"></label>
<label>簡譜字級<input id="fontSize" type="number" min="10" max="36" step="1" value="17"></label>
<label class="chk"><input id="showTies" type="checkbox" checked>連結線</label>
<label class="chk"><input id="showSlurs" type="checkbox" checked>圓滑線</label>
<label class="chk"><input id="showLyrics" type="checkbox" checked>顯示歌詞</label>
<label>歌詞字級<input id="lyricSize" type="number" min="8" max="30" step="1" value="13"></label>
<label class="chk"><input id="showStaff" type="checkbox" checked>顯示五線譜</label>
<label>標題<input id="title" type="text"></label>
<label>作曲<input id="composer" type="text"></label>
<label>演唱／來源<input id="singer" type="text"></label>
<label>副標題（留空自動產生）<input id="subtitle" type="text" style="width:240px"></label>
<button id="print" type="button">列印／存成 PDF</button>
<button id="play" type="button">▶ 播放</button>
<label>速度 <span id="speedv">100%</span><input id="speed" type="range" min="50" max="150" step="5" value="100" style="width:110px"></label>
<button id="dlMidi" class="alt" type="button">下載 MIDI</button>
<button id="dlXml" class="alt" type="button">下載標註 MusicXML</button>
<span id="meta"></span>
<details class="lyr"><summary>圖檔辨識設定</summary>
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0">
<label>本機服務位址<input id="omrUrl" type="text" value="http://127.0.0.1:8765" style="width:220px"></label>
<label>PDF 頁碼<input id="omrPage" type="number" min="1" value="1"></label>
<span id="omrStatus" style="font-size:13px"></span></div>
<div class="hint" style="margin:0">圖檔只會送到你自己電腦上的辨識服務（backend/），不會上傳到網路。辨識用 homr；第一次執行會下載模型。</div>
</details>
<details class="lyr"><summary>貼上歌詞（會取代檔案裡的歌詞；一行一段）</summary>
<textarea id="lyricText" rows="4" placeholder="中文每個字對應一個音；英文用空格或 - 分音節；用 _ 表示這個音沒有字"></textarea>
</details>
<div id="err"></div>
<div class="hint">可直接把 .musicxml / .xml / .mxl 拖進視窗。所有處理都在你的瀏覽器內完成，檔案不會上傳。列印時請選 A4。目前只取第一聲部；和弦取最高音；連結線（tie）以兩個數字呈現。簡譜字級放大後若太擠，請把「每行小節數」調少。</div>
</div>
<div class="page"><div id="origBox" class="orig"></div><div id="sheet"></div></div>
<script>%%VEXFLOW%%</script>
<script>%%SAMPLE%%</script>
<script>%%APP%%</script>
</body></html>
